<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUAVE Catalog Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --surface-2:#f2f1ee; --surface-3:#e6e5e1;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#82817c;
  --rule:#d8d7d2; --accent:#A8481B;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --critical:#d03b3b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-1:#141413; --surface-2:#1e1e1d; --surface-3:#2b2b29;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8e8d85;
    --rule:#343431; --accent:#E17F45;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#141413; --surface-2:#1e1e1d; --surface-3:#2b2b29;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8e8d85;
  --rule:#343431; --accent:#E17F45;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--surface-1); color:var(--text-primary);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif; font-size:14px; overflow:hidden}
#app{display:grid; grid-template-columns:1fr 340px; grid-template-rows:auto 1fr; height:100%}
body.wide #app{grid-template-columns:1fr 0}
body.wide aside{display:none}
header{grid-column:1/-1; display:flex; align-items:baseline; gap:13px; flex-wrap:wrap;
  padding:9px 16px; border-bottom:1px solid var(--rule); background:var(--surface-2)}
header h1{margin:0; font-size:16px; font-weight:700; letter-spacing:-.01em}
header .sub{color:var(--text-secondary); font-size:12.5px}
header a{color:var(--accent); font-size:12px}
header .counts{margin-left:auto; display:flex; gap:13px; font-size:12px; color:var(--text-secondary)}
header .counts b{color:var(--text-primary); font-family:"JetBrains Mono",monospace}
#stage{position:relative; overflow:hidden}
canvas{display:block; width:100%; height:100%; cursor:grab}
canvas.dragging{cursor:grabbing}
.floaty{position:absolute; background:color-mix(in srgb, var(--surface-2) 94%, transparent);
  border:1px solid var(--rule); border-radius:7px; backdrop-filter:blur(4px)}
#controls{left:14px; top:14px; display:flex; flex-direction:column; gap:6px; padding:10px 12px;
  max-width:262px; max-height:calc(100% - 28px); overflow:auto}
#controls .row{display:flex; gap:5px; flex-wrap:wrap; align-items:center}
.ttl{font-size:9.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-muted); margin-top:3px}
button,.chip{font:inherit; font-size:11.5px; padding:3px 8px; border-radius:20px; cursor:pointer;
  border:1px solid var(--rule); background:var(--surface-3); color:var(--text-secondary)}
button:hover,.chip:hover{border-color:var(--text-muted); color:var(--text-primary)}
.chip.on{background:var(--text-primary); color:var(--surface-1); border-color:var(--text-primary)}
.chip .sw{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px}
button:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
input[type=search]{font:inherit; font-size:12px; width:100%; padding:4px 8px; border-radius:4px;
  border:1px solid var(--rule); background:var(--surface-1); color:var(--text-primary)}
input[type=range]{width:100%; accent-color:var(--accent)}
#legend{right:14px; bottom:14px; display:flex; flex-direction:column; gap:3px; padding:9px 11px; font-size:11.5px}
#legend .item{display:flex; align-items:center; gap:7px; color:var(--text-secondary)}
#legend .dot{width:9px; height:9px; border-radius:50%; flex:none}
#legend .ln{width:18px; height:0; border-top-width:2px; flex:none}
#crumb{left:14px; bottom:14px; padding:7px 11px; font-size:12px; color:var(--text-secondary);
  font-family:"JetBrains Mono",monospace; max-width:60%; display:none}
#tip{position:absolute; pointer-events:none; opacity:0; transition:opacity .07s;
  background:var(--surface-1); border:1px solid var(--rule); border-radius:5px; padding:6px 9px;
  font-size:12px; box-shadow:0 3px 14px rgba(0,0,0,.2); max-width:320px; z-index:5}
#tip .n{font-weight:700} #tip .m{color:var(--text-secondary); font-size:11px}
aside{border-left:1px solid var(--rule); background:var(--surface-2); overflow-y:auto; padding:14px 16px}
aside h2{margin:0 0 2px; font-size:15px; font-weight:700; word-break:break-word}
aside .kind{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-muted)}
aside section{margin-top:13px}
aside h3{margin:0 0 5px; font-size:10px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--text-muted)}
aside p{margin:0 0 6px; font-size:13px; color:var(--text-secondary); line-height:1.5}
aside ul{margin:0; padding-left:15px; font-size:12.5px; color:var(--text-secondary); line-height:1.55}
.path{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--text-secondary); word-break:break-all}
.pill{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:1px 7px; border-radius:9px; border:1px solid; margin:0 4px 3px 0}
.link{cursor:pointer; text-decoration:underline dotted; text-underline-offset:2px}
.link:hover{color:var(--text-primary)}
.bar{height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin:3px 0 6px}
.bar i{display:block; height:100%; background:var(--good)}
table{border-collapse:collapse; width:100%; font-size:12px; margin-top:6px}
th,td{text-align:left; padding:4px 6px; border-bottom:1px solid var(--rule); vertical-align:top; color:var(--text-secondary)}
th{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted);
  position:sticky; top:0; background:var(--surface-1)}
#tablewrap{display:none; grid-column:1/-1; overflow:auto; padding:16px 20px}
body.table-mode #stage,body.table-mode aside{display:none}
body.table-mode #tablewrap{display:block}
@media (max-width:980px){#app{grid-template-columns:1fr} aside{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>SUAVE catalog</h1>
    <span class="sub">every package, module and class — containment as geometry, connections as arcs</span>
    <a href="index.html">← overview</a>
    <a href="component_graph.html">propulsion view →</a>
    <div class="counts" id="counts"></div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="floaty" id="controls">
      <div class="ttl">view</div>
      <div class="row">
        <button id="reset">reset</button><button id="spin" class="chip on">rotate</button>
        <button id="flat" class="chip">flat</button><button id="wide" class="chip">wide</button>
        <button id="theme">theme</button>
      </div>
      <div class="ttl">depth <span id="depthv" class="path"></span></div>
      <input type="range" id="depth" min="1" max="6" value="6">
      <div class="ttl">show</div>
      <div class="row" id="kindRow"></div>
      <div class="ttl">top-level package</div>
      <div class="row" id="pkgRow"></div>
      <div class="ttl">connections</div>
      <div class="row" id="edgeRow"></div>
      <div class="ttl">coverage</div>
      <div class="row"><button id="onlyUsed" class="chip">only what aeroforge uses</button></div>
      <div class="ttl">find</div>
      <input type="search" id="search" placeholder="class, module, package…" autocomplete="off">
      <div class="row"><button id="tableBtn">table view</button></div>
    </div>
    <div class="floaty" id="legend"></div>
    <div class="floaty" id="crumb"></div>
    <div id="tip"></div>
  </div>
  <aside id="panel"></aside>
  <div id="tablewrap"><button id="backBtn">← back to graph</button><div id="tables"></div></div>
</div>

/* ------------------------------------------------------------- indexing */
const N = new Map(G.nodes.map(n => [n.id, n]));
const kids = new Map(), parent = new Map();
const inh = {out:new Map(), in:new Map()}, imp = {out:new Map(), in:new Map()},
      uses = {out:new Map(), in:new Map()};
const push = (m, k, v) => { (m.get(k) || m.set(k, []).get(k)).push(v); };
for (const e of G.edges) {
  if (!N.has(e.a) || !N.has(e.b)) continue;
  if (e.t === "contains") { push(kids, e.a, e.b); parent.set(e.b, e.a); }
  else if (e.t === "inherits") { push(inh.out, e.a, e.b); push(inh.in, e.b, e.a); }
  else if (e.t === "imports") { push(imp.out, e.a, e.b); push(imp.in, e.b, e.a); }
  else { push(uses.out, e.a, {id:e.b, t:e.t.slice(5)}); push(uses.in, e.b, {id:e.a, t:e.t.slice(5)}); }
}
for (const n of G.nodes) {
  let c = n.id, chain = [];
  while (c && c !== "pkg:") { chain.unshift(N.get(c).label); c = parent.get(c); }
  n.chain = chain;
  n.top = chain.length ? chain[0] : "SUAVE";
}

/* ------------------------------------------------- sunburst on the plane */
const RING = [0, 230, 470, 710, 950, 1190, 1430, 1670];   // inner edge of each ring
const BAND = 150;                                          // radial depth of a ring
const MIN_SEP = 20;                                        // wanted spacing between leaf marks
const MAX_ROWS = 8;                                        // rows a package may stack its leaves in
const leafCache = new Map();
function leaves(id){
  if (leafCache.has(id)) return leafCache.get(id);
  const k = kids.get(id);
  const v = (!k || !k.length) ? 1 : k.reduce((s, c) => s + leaves(c), 0);
  leafCache.set(id, v); return v;
}
function order(id){
  return (kids.get(id) || []).slice().sort((p, q) => {
    const a = N.get(p), b = N.get(q);
    if ((a.kind === "package") !== (b.kind === "package")) return a.kind === "package" ? -1 : 1;
    return a.label.localeCompare(b.label);
  });
}
/* A package owns an arc band; its sub-packages divide the arc, and its own modules and
   classes are packed into rows *inside* the band rather than strung along one line -
   without that, 280 leaves on one ring sit 2px apart and smear into a solid stripe. */
function place(id, a0, a1, d){
  const n = N.get(id);
  n.d = Math.min(d, RING.length - 1);
  n.a0 = a0; n.a1 = a1; n.ang = (a0 + a1) / 2;
  n.r0 = RING[n.d]; n.r1 = RING[n.d] + BAND;
  const rr = n.r0 + BAND * .5;
  n.x = Math.cos(n.ang) * rr; n.z = Math.sin(n.ang) * rr; n.y = 0;
  const k = order(id);
  if (!k.length) return;
  const pkgs = k.filter(c => N.get(c).kind === "package");
  const lfs  = k.filter(c => N.get(c).kind !== "package");
  const weight = pkgs.reduce((s, c) => s + leaves(c), 0) + lfs.length;
  const pad = Math.min((a1 - a0) * .18, (d === 0 ? .075 : d === 1 ? .022 : .006) * k.length);
  const span = (a1 - a0) - pad, gap = k.length > 1 ? pad / (k.length - 1) : 0;
  let a = a0;
  for (const c of pkgs) { const w = leaves(c) / weight * span; place(c, a, a + w, d + 1); a += w + gap; }
  if (lfs.length) {
    const w = lfs.length / weight * span;
    const dd = Math.min(d + 1, RING.length - 1);
    const rMid = RING[dd] + BAND * .5;
    let cols = Math.max(1, Math.min(lfs.length, Math.floor(w * rMid / MIN_SEP)));
    let rows = Math.max(1, Math.ceil(lfs.length / cols));
    if (rows > MAX_ROWS) { rows = MAX_ROWS; cols = Math.ceil(lfs.length / rows); }
    lfs.forEach((c, i) => {
      const m = N.get(c), col = i % cols, row = Math.floor(i / cols);
      m.d = dd; m.ang = a + (col + .5) * (w / cols);
      const rad = RING[dd] + BAND * (row + .5) / rows;
      m.a0 = m.ang; m.a1 = m.ang; m.r0 = rad; m.r1 = rad;
      m.x = Math.cos(m.ang) * rad; m.z = Math.sin(m.ang) * rad; m.y = 0;
    });
    a += w;
  }
}
place("pkg:", -Math.PI / 2, Math.PI * 1.5, 0);

/* ------------------------------------------------------------ appearance */
const TOPS = ["Components","Analyses","Methods","Attributes","Core","Input_Output","Optimization"];
const SLOT = Object.fromEntries(TOPS.map((t, i) => [t, "--s" + (i + 1)]));
let CSSV = {};
function readTheme(){
  const s = getComputedStyle(document.documentElement); CSSV = {};
  for (const k of ["--surface-1","--surface-2","--surface-3","--text-primary","--text-secondary",
                   "--text-muted","--rule","--accent","--good","--critical",
                   "--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"])
    CSSV[k] = s.getPropertyValue(k).trim();
}
readTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTheme(); legend(); chips(); });
const topColor = t => CSSV[SLOT[t] || "--s8"];
const nodeColor = n => n.id === "pkg:" ? CSSV["--text-primary"] : topColor(n.top);
function hexA(hex, a){
  const h = hex.replace("#", "");
  const v = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  return `rgba(${parseInt(v.slice(0,2),16)},${parseInt(v.slice(2,4),16)},${parseInt(v.slice(4,6),16)},${a})`;
}

/* ----------------------------------------------------------------- state */
const S = {yaw:.0, pitch:.92, dist:3300, spin:true, flat:false, depth:6, onlyUsed:false,
           kinds:{package:true, class:true, module:true},
           hover:null, sel:null, query:"",
           pkgs:new Set([...TOPS, "Plots", "Surrogate", "SUAVE"]),
           types:{inherits:true, imports:false, uses:true, contains:false}};

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  DPR = Math.min(devicePixelRatio || 1, 2); W = r.width; H = r.height;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
new ResizeObserver(resize).observe(document.getElementById("stage"));

const vis = n => n.d <= S.depth && S.pkgs.has(n.top) && S.kinds[n.kind]
              && (!S.onlyUsed || n.used || n.kind === "package");
const matches = n => !S.query || n.label.toLowerCase().includes(S.query.toLowerCase())
                              || (n.path || "").toLowerCase().includes(S.query.toLowerCase());
function neighbours(id){
  const s = new Set([id]);
  for (const v of (kids.get(id) || [])) s.add(v);
  for (const m of [inh.out, inh.in, imp.out, imp.in]) for (const v of (m.get(id) || [])) s.add(v);
  for (const m of [uses.out, uses.in]) for (const v of (m.get(id) || [])) s.add(v.id);
  let p = parent.get(id); while (p) { s.add(p); p = parent.get(p); }
  return s;
}
function project(x, y, z){
  const cy = Math.cos(S.yaw), sy = Math.sin(S.yaw);
  let X = x * cy - z * sy, Z = x * sy + z * cy;
  const cp = Math.cos(S.pitch), sp = Math.sin(S.pitch);
  const Y2 = y * cp - Z * sp; Z = y * sp + Z * cp;
  const zc = Z + S.dist;
  if (zc < 60) return null;
  const f = 1400 / zc;
  return {sx: W / 2 + X * f, sy: H / 2 - Y2 * f, f, z: zc};
}

/* ---------------------------------------------------------------- render */
let bandPaths = [];
function draw(){
  ctx.clearRect(0, 0, W, H);
  const focus = (S.sel || S.hover) ? neighbours(S.sel || S.hover) : null;
  const shown = G.nodes.filter(vis);
  const P = new Map();
  for (const n of shown) { const p = project(n.x, n.y, n.z); if (p) P.set(n.id, p); }

  // ---- 1. package arc bands: containment shown as geometry, not as lines
  bandPaths = [];
  const bands = shown.filter(n => n.kind === "package" && n.id !== "pkg:")
                     .map(n => ({n, z:(project(n.x, 0, n.z) || {z:1e9}).z}))
                     .sort((a, b) => b.z - a.z);
  for (const {n} of bands) {
    const steps = Math.max(2, Math.min(64, Math.ceil((n.a1 - n.a0) * 34)));
    const pts = [];
    for (let i = 0; i <= steps; i++) { const a = n.a0 + (n.a1 - n.a0) * i / steps;
      pts.push(project(Math.cos(a) * n.r1, 0, Math.sin(a) * n.r1)); }
    for (let i = steps; i >= 0; i--) { const a = n.a0 + (n.a1 - n.a0) * i / steps;
      pts.push(project(Math.cos(a) * n.r0, 0, Math.sin(a) * n.r0)); }
    if (pts.some(p => !p)) continue;
    const path = new Path2D();
    path.moveTo(pts[0].sx, pts[0].sy);
    for (let i = 1; i < pts.length; i++) path.lineTo(pts[i].sx, pts[i].sy);
    path.closePath();
    const inF = !focus || focus.has(n.id);
    const q = S.query ? (matches(n) ? 1 : .25) : 1;
    ctx.fillStyle = hexA(topColor(n.top), (inF ? .17 : .04) * q + (n.d === 1 ? .06 : 0));
    ctx.fill(path);
    ctx.strokeStyle = hexA(topColor(n.top), (inF ? .5 : .1) * q);
    ctx.lineWidth = n.d === 1 ? 1.4 : 1; ctx.stroke(path);
    bandPaths.push({n, path});
  }

  // ---- 2. connections, arcing out of the plane
  const arcs = [];
  for (const e of G.edges) {
    const grp = e.t === "contains" ? "contains" : e.t === "inherits" ? "inherits"
              : e.t === "imports" ? "imports" : "uses";
    if (!S.types[grp]) continue;
    const a = N.get(e.a), b = N.get(e.b);
    if (!P.has(e.a) || !P.has(e.b)) continue;
    arcs.push({e, grp, a, b, inF: !focus || (focus.has(e.a) && focus.has(e.b))});
  }
  for (const s of arcs) {
    let col, alpha, dash = [], lift, samples;
    if (s.grp === "contains") { col = CSSV["--rule"]; alpha = .4; lift = 0; samples = 2; }
    else if (s.grp === "inherits") { col = topColor(s.a.top); alpha = .55; lift = 1; samples = 14; }
    else if (s.grp === "imports") { col = topColor(s.a.top); alpha = .13; lift = -1; samples = 9; dash = [1,3]; }
    else { col = CSSV["--accent"]; alpha = .8; lift = 1.5; samples = 14;
           dash = s.e.t === "uses_energy" ? [5,4] : s.e.t === "uses_support" ? [2,4]
                : s.e.t === "uses_thermal" ? [7,3,2,3] : []; }
    if (focus) { if (!s.inF && alpha < .3) continue; alpha = s.inF ? Math.max(alpha, .92) : .04; }
    else if (S.query) { alpha *= (matches(s.a) || matches(s.b)) ? 1 : .07; if (alpha < .02) continue; }
    const d = Math.hypot(s.a.x - s.b.x, s.a.z - s.b.z);
    const h = S.flat ? 0 : lift * (70 + d * .28);
    const cx = (s.a.x + s.b.x) / 2 * .42, cz = (s.a.z + s.b.z) / 2 * .42;
    ctx.strokeStyle = col; ctx.globalAlpha = alpha; ctx.setLineDash(dash);
    ctx.lineWidth = (focus && s.inF) ? 2 : 1.1;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i <= samples; i++) {
      const t = i / samples, u = 1 - t;
      const x = u * u * s.a.x + 2 * u * t * cx + t * t * s.b.x;
      const z = u * u * s.a.z + 2 * u * t * cz + t * t * s.b.z;
      const y = 2 * u * t * h;
      const p = project(x, y, z);
      if (!p) { started = false; continue; }
      if (!started) { ctx.moveTo(p.sx, p.sy); started = true; } else ctx.lineTo(p.sx, p.sy);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  // ---- 3. leaves
  const leavesShown = shown.filter(n => n.kind !== "package" && P.has(n.id))
                           .sort((a, b) => P.get(b.id).z - P.get(a.id).z);
  for (const n of leavesShown) {
    const p = P.get(n.id);
    const inF = !focus || focus.has(n.id);
    const alpha = focus ? (inF ? 1 : .09) : (S.query ? (matches(n) ? 1 : .1) : 1);
    const r = Math.max(1.6, (n.kind === "class" ? 3.0 : 2.4) * p.f * 1.7);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    if (n.kind === "module") ctx.rect(p.sx - r * .85, p.sy - r * .85, r * 1.7, r * 1.7);
    else ctx.arc(p.sx, p.sy, r, 0, 6.2832);
    ctx.fillStyle = nodeColor(n); ctx.fill();
    if (n.used) { ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 2.6, 0, 6.2832);
      ctx.strokeStyle = CSSV["--good"]; ctx.lineWidth = 1.3; ctx.stroke(); }
    if (n.id === S.sel || n.id === S.hover) {
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 6, 0, 6.2832);
      ctx.strokeStyle = CSSV["--text-primary"]; ctx.lineWidth = 1.6; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // ---- 4. labels last, so nothing draws over them
  const labels = [];
  for (const n of shown) {
    const p = P.get(n.id); if (!p) continue;
    const isSel = n.id === S.sel || n.id === S.hover;
    const want = isSel || (focus && focus.has(n.id) && n.kind !== "package")
              || (n.kind === "package" && n.d <= (S.depth >= 3 ? 2 : S.depth))
              || (S.query && matches(n) && n.kind !== "package");
    if (!want) continue;
    labels.push({n, p, big: n.kind === "package", isSel});
  }
  labels.sort((a, b) => (b.big ? 1 : 0) - (a.big ? 1 : 0));
  const taken = [];
  for (const L of labels) {
    const fs = Math.max(9.5, Math.min(17, (L.big ? 14 - L.n.d : 10.5) * L.p.f * 1.5));
    ctx.font = `${L.big ? 700 : 500} ${fs}px Archivo, sans-serif`;
    const w = ctx.measureText(L.n.label).width, x = L.p.sx, y = L.p.sy - (L.big ? 2 : 9);
    const box = [x - w / 2 - 3, y - fs, x + w / 2 + 3, y + 3];
    if (!L.isSel && taken.some(t => !(box[2] < t[0] || box[0] > t[2] || box[3] < t[1] || box[1] > t[3])))
      continue;                                   // drop colliding labels instead of stacking them
    taken.push(box);
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.lineWidth = 3.5; ctx.strokeStyle = CSSV["--surface-1"];
    ctx.strokeText(L.n.label, x, y);
    ctx.fillStyle = L.big ? CSSV["--text-primary"] : CSSV["--text-secondary"];
    ctx.fillText(L.n.label, x, y);
  }
  window.__P = P;
}
function loop(){ if (S.spin && !drag.on) S.yaw += .0011; draw(); requestAnimationFrame(loop); }

/* ----------------------------------------------------------- interaction */
const drag = {on:false, x:0, y:0};
cv.addEventListener("pointerdown", e => { drag.on = true; drag.x = e.clientX; drag.y = e.clientY;
  cv.classList.add("dragging"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointerup", e => {
  drag.on = false; cv.classList.remove("dragging");
  if (Math.abs(e.clientX - drag.x) < 4 && Math.abs(e.clientY - drag.y) < 4) {
    const h = pick(e); S.sel = h ? h.id : null; panel(); crumb();
  }
});
cv.addEventListener("pointermove", e => {
  if (drag.on) { S.yaw += (e.clientX - drag.x) * .006;
    S.pitch = Math.max(.08, Math.min(1.52, S.pitch + (e.clientY - drag.y) * .004));
    drag.x = e.clientX; drag.y = e.clientY; return; }
  const h = pick(e); S.hover = h ? h.id : null;
  const tip = document.getElementById("tip");
  if (h) {
    tip.innerHTML = `<div class="n">${esc(h.label)}</div><div class="m">${
      esc(h.path || h.chain.join(" / ") || "SUAVE")}</div>`;
    const r = cv.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX - r.left + 15, W - 330) + "px";
    tip.style.top = (e.clientY - r.top + 15) + "px"; tip.style.opacity = 1;
  } else tip.style.opacity = 0;
});
cv.addEventListener("pointerleave", () => { S.hover = null; document.getElementById("tip").style.opacity = 0; });
cv.addEventListener("wheel", e => { e.preventDefault();
  S.dist = Math.max(500, Math.min(9000, S.dist * (1 + Math.sign(e.deltaY) * .1))); }, {passive:false});
addEventListener("keydown", e => { if (e.key === "Escape") { S.sel = null; panel(); crumb(); } });
function pick(ev){
  const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  let best = null, bd = 14;
  for (const [id, p] of (window.__P || new Map())) {
    const n = N.get(id); if (n.kind === "package") continue;
    const d = Math.hypot(p.sx - mx, p.sy - my);
    if (d < bd) { best = n; bd = d; }
  }
  if (best) return best;
  for (let i = bandPaths.length - 1; i >= 0; i--)          // topmost band under the cursor
    if (ctx.isPointInPath(bandPaths[i].path, mx * DPR / DPR, my)) return bandPaths[i].n;
  return null;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const li = id => `<li class="link" data-go="${esc(id)}">${esc(N.get(id).label)}</li>`;

/* ---------------------------------------------------------------- panel */
function coverage(id){
  let tot = 0, used = 0;
  (function walk(x){ const n = N.get(x);
    if (n.kind === "class") { tot++; if (n.used) used++; }
    for (const c of (kids.get(x) || [])) walk(c); })(id);
  return {tot, used};
}
function crumb(){
  const el = document.getElementById("crumb");
  const n = S.sel ? N.get(S.sel) : null;
  if (!n) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.textContent = "SUAVE / " + n.chain.join(" / ");
}
function panel(){
  const el = document.getElementById("panel");
  const n = S.sel ? N.get(S.sel) : null;
  if (!n) { el.innerHTML = intro(); return; }
  let h = `<div class="kind">${esc(n.kind)}${n.top !== n.label ? " · " + esc(n.top) : ""}</div>
           <h2>${esc(n.label)}</h2>`;
  if (n.path) h += `<p class="path">${esc(n.path)}</p>`;
  if (n.used) {
    h += "<p>";
    if (n.role) h += `<span class="pill" style="color:var(--good);border-color:var(--good)">${esc(n.role.replace(/_/g," "))}</span>`;
    if (n.family) h += `<span class="pill" style="color:var(--text-secondary);border-color:var(--rule)">${esc(n.family)}</span>`;
    if (n.wired !== undefined) h += n.wired
      ? `<span class="pill" style="color:var(--good);border-color:var(--good)">wired</span>`
      : `<span class="pill" style="color:var(--text-muted);border-color:var(--rule)">no wiring</span>`;
    if (n.excluded) h += `<span class="pill" style="color:var(--critical);border-color:var(--critical)">excluded</span>`;
    if (n.imported_by_aeroforge) h += `<span class="pill" style="color:var(--accent);border-color:var(--accent)">imported</span>`;
    h += "</p>";
    if (n.description) h += `<p>${esc(n.description)}</p>`;
    if (n.mach) h += `<ul><li>Mach ${n.mach[0]} – ${n.mach[1]}</li><li>engines ${n.engine_counts.join(", ")}</li>
      <li>mountings ${n.mountings.join(", ")}</li><li>${n.nvars} design variables</li></ul>`;
  }
  if (n.kind === "package") {
    const c = coverage(n.id), k = kids.get(n.id) || [];
    const pk = k.filter(i => N.get(i).kind === "package"), lf = k.filter(i => N.get(i).kind !== "package");
    h += `<section><h3>coverage</h3><div class="bar"><i style="width:${c.tot ? c.used / c.tot * 100 : 0}%"></i></div>
          <p>${c.used} of ${c.tot} classes below here are reached by aeroforge</p></section>`;
    if (pk.length) h += `<section><h3>packages (${pk.length})</h3><ul>${pk.map(li).join("")}</ul></section>`;
    if (lf.length) h += `<section><h3>modules and classes (${lf.length})</h3><ul>${
      lf.slice(0, 60).map(li).join("")}${lf.length > 60 ? "<li>…</li>" : ""}</ul></section>`;
  }
  for (const [t, arr] of [["inherits from", inh.out.get(n.id)], ["subclasses", inh.in.get(n.id)],
                          ["imports", imp.out.get(n.id)], ["imported by", imp.in.get(n.id)]])
    if (arr && arr.length) h += `<section><h3>${t} (${arr.length})</h3><ul>${
      [...new Set(arr)].slice(0, 30).map(li).join("")}</ul></section>`;
  const u = uses.out.get(n.id);
  if (u && u.length) h += `<section><h3>aeroforge builds it from</h3><ul>${u.map(x =>
    `<li class="link" data-go="${esc(x.id)}">${esc(N.get(x.id).label)} <span class="path">${esc(x.t)}</span></li>`).join("")}</ul></section>`;
  const ub = uses.in.get(n.id);
  if (ub && ub.length) h += `<section><h3>used by ${ub.length} network${ub.length === 1 ? "" : "s"}</h3><ul>${
    ub.map(x => `<li class="link" data-go="${esc(x.id)}">${esc(N.get(x.id).label)} <span class="path">${esc(x.t)}</span></li>`).join("")}</ul></section>`;
  el.innerHTML = h;
  el.querySelectorAll("[data-go]").forEach(x => x.addEventListener("click", () => {
    S.sel = x.dataset.go; panel(); crumb(); }));
}
function intro(){
  const c = coverage("pkg:");
  return `<section><h3>what this is</h3>
    <p>The whole SUAVE package: <b>${G.nodes.filter(n => n.kind === "package").length}</b> packages,
    <b>${G.nodes.filter(n => n.kind === "module").length}</b> modules and
    <b>${G.nodes.filter(n => n.kind === "class").length}</b> classes, drawn as a sunburst.
    Containment is the geometry — a package is the arc band its children sit inside — so no
    line is wasted on it. The third dimension carries the connections instead.</p>
    <p><b>Inheritance</b> arcs rise above the plane, <b>imports</b> dip below it, and
    <b>aeroforge uses</b> arcs are the accent colour. Each is read from the source: bases
    resolved through the defining module's own imports, imports from the statements
    themselves.</p></section>
    <section><h3>coverage</h3><div class="bar"><i style="width:${c.used / c.tot * 100}%"></i></div>
    <p><b>${c.used}</b> of <b>${c.tot}</b> classes are reached by aeroforge — green rings.</p></section>
    <section><h3>controls</h3><ul>
      <li>drag to rotate, wheel to zoom</li>
      <li><b>flat</b> drops the arcs into the plane for a clean read</li>
      <li><b>wide</b> hides this panel</li>
      <li>depth slider peels back the outer rings</li>
      <li>imports are off by default — ${G.edges.filter(e => e.t === "imports").length} of them</li></ul></section>`;
}

function chips(){

function toggles(rowId, keys, store){

document.getElementById("onlyUsed").onclick = e => { S.onlyUsed = !S.onlyUsed; e.currentTarget.classList.toggle("on", S.onlyUsed); };
document.getElementById("depth").oninput = e => { S.depth = +e.target.value;
  document.getElementById("depthv").textContent = S.depth >= 6 ? "all" : "≤ " + S.depth; };
document.getElementById("search").oninput = e => { S.query = e.target.value.trim(); };
document.getElementById("theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
             : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next); readTheme(); legend(); chips();
};
document.getElementById("tableBtn").onclick = () => document.body.classList.add("table-mode");
document.getElementById("backBtn").onclick = () => document.body.classList.remove("table-mode");

const classes = G.nodes.filter(n => n.kind === "class");
document.getElementById("counts").innerHTML =
  `<span><b>${G.nodes.filter(n => n.kind === "package").length}</b> packages</span>
   <span><b>${G.nodes.filter(n => n.kind === "module").length}</b> modules</span>
   <span><b>${classes.length}</b> classes</span>
   <span><b>${G.edges.filter(e => e.t === "inherits").length}</b> inherits</span>
   <span><b>${G.edges.filter(e => e.t === "imports").length}</b> imports</span>
   <span><b>${classes.filter(n => n.used).length}/${classes.length}</b> reached</span>`;
document.getElementById("depthv").textContent = "all";

document.getElementById("tables").innerHTML = `
  <h2 style="font-size:16px">Every class in the SUAVE catalog</h2>
  <table><thead><tr><th>Class</th><th>Package</th><th>Module</th><th>Inherits</th><th>aeroforge</th></tr></thead><tbody>${
    classes.slice().sort((a, b) => a.top.localeCompare(b.top) || a.label.localeCompare(b.label))
      .map(n => `<tr><td><b>${esc(n.label)}</b></td><td>${esc(n.top)}</td>
        <td class="path">${esc(n.path)}</td>
        <td>${(inh.out.get(n.id) || []).map(i => esc(N.get(i).label)).join(", ") || "—"}</td>
        <td>${n.used ? (n.role || n.family || "used") : "—"}</td></tr>`).join("")}</tbody></table>`;

resize(); legend(); chips();
toggles("kindRow", ["package","class","module"], S.kinds);
toggles("edgeRow", ["inherits","imports","uses","contains"], S.types);
panel(); loop();
</script>
</body>
</html>
